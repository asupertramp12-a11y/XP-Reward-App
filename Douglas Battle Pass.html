<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Douglas Battle Pass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#03040a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one command column over a cinematic 3D scene. Obsidian glass panels with hairline edges, HUD corner brackets on the briefing card, a floating command bar. */
:root{
  color-scheme:dark;
  --void:#03040a;
  --panel:rgba(12,16,30,.58);
  --panel-2:rgba(255,255,255,.045);
  --line:rgba(170,200,255,.13);
  --ink:#f2f5ff;
  --ink-2:rgba(208,218,242,.74);
  --ink-3:rgba(208,218,242,.46);
  --cyan:#46e0ff;
  --cyan-dim:rgba(70,224,255,.16);
  --red:#ff3a5c;
  --gold:#f5c451;
  --violet:#8a7dff;
  --lime:#3ef0a0;
  --shadow:0 20px 50px rgba(0,0,0,.55);
  --r:18px;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Saira",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--f-body);color:var(--ink);background:var(--void);overflow-x:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#scene{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block}
.fallback{position:fixed;inset:0;z-index:-3;background:
  radial-gradient(70% 50% at 85% 95%,rgba(70,140,255,.22),transparent 70%),
  radial-gradient(50% 40% at 0% 10%,rgba(138,125,255,.14),transparent 70%),var(--void)}
.vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(130% 90% at 50% 35%,transparent 50%,rgba(2,3,8,.82)),
  linear-gradient(180deg,rgba(2,3,8,.55),transparent 25%)}

.glass{background:var(--panel);backdrop-filter:blur(20px) saturate(130%);-webkit-backdrop-filter:blur(20px) saturate(130%);border-radius:var(--r);box-shadow:var(--shadow),inset 0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.07)}
.wrap{max-width:580px;margin:0 auto;padding-block:16px calc(124px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;letter-spacing:.22em;color:var(--cyan);margin-bottom:6px}
.hud{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;font-weight:600;font-size:13px}
.chip.tok{font-weight:700;color:var(--gold)}
.chip.tok svg{font-size:16px}
.sync{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync[data-s="synced"] i{background:var(--lime);box-shadow:0 0 8px var(--lime)}
.sync[data-s="saving"] i,.sync[data-s="connecting"] i{background:var(--gold);animation:blink 1s infinite}
.sync[data-s="offline"] i,.sync[data-s="readonly"] i{background:var(--red)}
@keyframes blink{50%{opacity:.25}}

.sec{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);margin:30px 2px 12px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec:first-child{margin-top:4px}
.view{display:none}
.view.on{display:block;animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.eyebrow{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan)}

/* Briefing card */
.brief{padding:22px 20px 20px;position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(70,224,255,.13),rgba(12,16,30,.55) 45%,rgba(255,58,92,.08))}
.brief::before{content:"";position:absolute;inset:10px;pointer-events:none;background:
  linear-gradient(var(--cyan),var(--cyan)) top left/14px 1.5px no-repeat,
  linear-gradient(var(--cyan),var(--cyan)) top left/1.5px 14px no-repeat,
  linear-gradient(var(--cyan),var(--cyan)) top right/14px 1.5px no-repeat,
  linear-gradient(var(--cyan),var(--cyan)) top right/1.5px 14px no-repeat,
  linear-gradient(var(--cyan),var(--cyan)) bottom left/14px 1.5px no-repeat,
  linear-gradient(var(--cyan),var(--cyan)) bottom left/1.5px 14px no-repeat,
  linear-gradient(var(--cyan),var(--cyan)) bottom right/14px 1.5px no-repeat,
  linear-gradient(var(--cyan),var(--cyan)) bottom right/1.5px 14px no-repeat;opacity:.7}
.brief .daymark{position:absolute;right:18px;top:18px;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:26px;color:var(--dc);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line),0 0 26px color-mix(in srgb,var(--dc) 35%,transparent)}
.brief h1{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,9vw,44px);line-height:.95;letter-spacing:.02em;text-transform:uppercase;margin:10px 70px 6px 0;text-wrap:balance}
.brief .sub{font-weight:500;color:var(--ink-2);font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.tag{padding:5px 11px;border-radius:8px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.note{display:flex;gap:8px;align-items:center;font-weight:500;font-size:14px;color:var(--ink-2)}
.note svg{color:var(--cyan);font-size:17px}
.brief .status{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.status .st{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.status .st.ok{color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;background:var(--cyan);color:#021018;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 10px 26px rgba(70,224,255,.3);transition:transform .15s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:#1d1400;box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 10px 26px rgba(245,196,81,.3)}
.btn.ghost{background:var(--panel-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:rgba(255,58,92,.12);color:#ffb3c0;box-shadow:inset 0 0 0 1px rgba(255,58,92,.35)}
.btn:disabled{opacity:.55;cursor:default}

/* Energy bars */
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,rgba(70,224,255,.5),var(--cyan));box-shadow:0 0 12px var(--cyan);transition:width .8s cubic-bezier(.2,.9,.2,1)}
.bar.gold i{background:linear-gradient(90deg,rgba(245,196,81,.5),var(--gold));box-shadow:0 0 12px var(--gold)}

/* Rank */
.rank{margin-top:12px;padding:18px;display:flex;gap:18px;align-items:center}
.hex{width:74px;height:84px;flex:none;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--cyan),var(--violet) 60%,var(--red));position:relative}
.hex::before{content:"";position:absolute;inset:2px;clip-path:inherit;background:linear-gradient(160deg,#101830,#070a16)}
.hex svg{position:relative;font-size:32px;color:var(--cyan);filter:drop-shadow(0 0 8px rgba(70,224,255,.7))}
.rank .info{flex:1;min-width:0}
.rank .name{font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:.04em;text-transform:uppercase;line-height:1;margin:6px 0 10px}
.meta{font-size:12px;font-weight:500;color:var(--ink-2);margin-top:8px}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat{padding:16px;min-width:0}
.stat .k{display:flex;gap:7px;align-items:center;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.stat .k svg{font-size:15px;color:var(--cyan)}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;margin-top:10px}
.stat .v small{font-size:18px;color:var(--ink-3);font-weight:600}
.stat .h{font-size:12px;font-weight:500;color:var(--ink-2);margin-top:6px}
.stat.cash .k svg,.stat.cash .v{color:var(--gold)}
.stat.cash .v{text-shadow:0 0 20px rgba(245,196,81,.35)}

/* Week */
.week{padding:18px;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row b{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase}
.row span{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--gold)}
.track{position:relative;margin:16px 0 30px}
.track .bar{height:8px}
.mk{position:absolute;top:-5px;width:1.5px;height:18px;background:rgba(255,255,255,.3)}
.mk em{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3)}
.mk.hit{background:var(--gold)} .mk.hit em{color:var(--gold)}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dot{text-align:center;padding:9px 0 8px;border-radius:10px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.dot b{display:block;font-family:var(--f-display);font-size:18px;color:var(--ink);letter-spacing:0;margin-bottom:2px}
.dot.full{background:rgba(245,196,81,.12);box-shadow:inset 0 0 0 1px rgba(245,196,81,.5);color:var(--gold)}
.dot.full b{color:var(--gold)}
.dot.today{box-shadow:inset 0 0 0 1.5px var(--cyan),0 0 16px rgba(70,224,255,.25);color:var(--cyan)}

/* Badges */
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{display:flex;align-items:center;gap:12px;padding:12px;min-width:0}
.medal{width:40px;height:46px;flex:none;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--gold),#b8801c);color:#1d1400;font-size:19px}
.badge div:last-child{min-width:0}
.badge b{display:block;font-size:14px;font-weight:700}
.badge small{display:block;font-size:11px;font-weight:500;color:var(--ink-2)}
.badge.locked .medal{background:rgba(255,255,255,.08);color:var(--ink-3)}
.badge.locked b{color:var(--ink-2)}

/* Storyboard */
.daycard{padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.daycard::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--dc),transparent);opacity:.8}
.daycard.today{box-shadow:var(--shadow),inset 0 0 0 1px rgba(70,224,255,.55),0 0 40px rgba(70,224,255,.16)}
.dh{display:flex;align-items:center;gap:14px}
.de{width:50px;height:50px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:24px;color:var(--dc);background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line)}
.dh .t{min-width:0}
.dn{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.now{background:var(--cyan);color:#021018;padding:2px 7px;border-radius:5px;letter-spacing:.14em;font-weight:700}
.dt{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;margin-top:3px}
.ds{font-size:12px;font-weight:500;color:var(--ink-2);margin-top:2px}
.ring{margin-left:auto;width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center}
.ring span{width:44px;height:44px;border-radius:50%;background:#0a0e1c;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.missions{display:grid;gap:6px;margin:16px 0 12px}
.m{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s,box-shadow .2s,transform .12s}
.m:active{transform:scale(.985)}
.m .mi{font-size:20px;color:var(--ink-3);transition:color .2s}
.m .mt{flex:1;font-weight:600;font-size:15px;min-width:0;color:var(--ink-2);transition:color .2s}
.m .mt small{display:block;font-weight:500;font-size:13px;color:var(--ink-3);margin-top:1px;transition:color .2s}
.m.done .mt small{color:var(--ink-2)}
.m .ck{width:24px;height:24px;flex:none;border-radius:7px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25);display:grid;place-items:center;font-size:16px;color:transparent;transition:all .2s}
.m.done{background:var(--cyan-dim);box-shadow:inset 0 0 0 1px rgba(70,224,255,.45)}
.m.done .mi{color:var(--cyan)}
.m.done .mt{color:var(--ink)}
.m.done .ck{background:var(--cyan);box-shadow:0 0 14px rgba(70,224,255,.6);color:#021018}
.game{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.game svg{font-size:20px}
.game small{margin-left:auto;font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;opacity:.85}
.game.lock{background:rgba(255,255,255,.03);color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line)}
.game.open{background:rgba(245,196,81,.12);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(245,196,81,.45),0 0 24px rgba(245,196,81,.14)}

/* Rewards */
.bank{padding:24px 20px;text-align:center;background:linear-gradient(170deg,rgba(245,196,81,.14),rgba(12,16,30,.6) 60%)}
.bank .v{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;color:var(--gold);margin:12px 0 8px;text-shadow:0 0 30px rgba(245,196,81,.4)}
.bank .v svg{font-size:40px}
.bank .h{font-size:13px;font-weight:500;color:var(--ink-2)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reward{padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.reward .ri{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;color:var(--cyan);background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line)}
.reward .rn{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;flex:1}
.reward .rc{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--gold);font-size:14px}
.reward .btn{padding:10px;font-size:14px}
.reward.ready{box-shadow:var(--shadow),inset 0 0 0 1px rgba(245,196,81,.55),0 0 30px rgba(245,196,81,.15)}
.reward.ready .ri{color:var(--gold)}
.hist{padding:4px 16px}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 0}
.hrow+.hrow{border-top:1px solid var(--line)}
.hrow .he{font-size:20px;color:var(--gold)}
.hrow .hn{flex:1;font-weight:600;font-size:14px;min-width:0}
.hrow .hn small{display:block;color:var(--ink-2);font-weight:500;font-size:12px}
.hrow button{font-size:12px;font-weight:600;color:var(--ink-2);padding:6px 10px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line)}
.empty{color:var(--ink-2);font-weight:500;font-size:14px;padding:16px 0;text-align:center}

/* Guide */
.gcard{padding:20px;margin-bottom:12px}
.gcard h3{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px}
.gcard h3 .gi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;color:var(--cyan);background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line)}
.gcard p{font-weight:500;color:var(--ink-2);line-height:1.6;font-size:15px;max-width:62ch}
.gcard p+p{margin-top:8px}
.rules{list-style:none;display:grid;gap:6px}
.rules li{display:flex;gap:12px;align-items:baseline;font-weight:500;font-size:15px;line-height:1.45;padding:9px 12px;border-radius:10px;background:var(--panel-2)}
.rules li::before{content:"";flex:none;width:6px;height:6px;border-radius:1px;transform:rotate(45deg) translateY(-2px);background:var(--cyan)}
.rules li.no{background:rgba(255,58,92,.08);box-shadow:inset 0 0 0 1px rgba(255,58,92,.3)}
.rules li.no::before{background:var(--red)}
.tbl{display:grid;gap:6px}
.tr{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;background:var(--panel-2);font-weight:500;font-size:15px}
.tr span:last-child{font-weight:700;color:var(--gold)}
.parent{display:grid;gap:10px;margin-top:14px}

/* Command bar */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));max-width:556px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:20px;z-index:20;background:rgba(8,11,22,.72)}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 8px;border-radius:14px;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);transition:color .2s,background .2s}
nav button svg{font-size:21px}
nav button.on{color:var(--cyan);background:var(--cyan-dim);box-shadow:inset 0 0 0 1px rgba(70,224,255,.35)}

/* Overlays */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(2,3,8,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mbox{width:100%;max-width:380px;padding:22px;background:rgba(14,18,34,.92)}
.mbox h3{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px}
.mbox p{color:var(--ink-2);font-weight:500;line-height:1.55;white-space:pre-line}
.mrow{display:flex;gap:10px;margin-top:20px}
.mrow .btn{flex:1}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-170%);z-index:50;display:grid;gap:6px;padding:14px 18px;min-width:240px;max-width:min(92vw,420px);border-radius:14px;background:rgba(10,14,28,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 0 0 1px rgba(70,224,255,.45),0 0 30px rgba(70,224,255,.2);transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
.toast.show{transform:translate(-50%,0)}
.toast div{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.toast svg{font-size:19px;color:var(--cyan)}
.toast .gold svg{color:var(--gold)}

<script>
/* ================= Icons ================= */
const ICONS = {

  tool:'<path d="M4 20l8.5-8.5"/><path d="M14.5 3.5a4.5 4.5 0 015.6 5.6l-2.6-.6-1.8 1.8.6 2.6a4.5 4.5 0 01-5.6-5.6z"/>',

const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ================= Data ================= */
const DAYS = [
  {name:'Monday',   icon:'home',    title:'Monday - OWS',       sub:'Our Wilde Space Day',     tags:['Explore','Learn','Create'],         col:'#8a7dff'},
  {name:'Tuesday',  icon:'compass', title:'Explorer Day',       sub:'Head out and discover',   tags:['Adventure','Discovery','Outdoors'], col:'#46e0ff'},
  {name:'Wednesday',icon:'book',    title:'Skill Up Day',       sub:'Sharpen your powers',     tags:['Learning','Reading','Fitness'],     col:'#3ef0a0'},
  {name:'Thursday', icon:'tool',    title:'Builder Day',        sub:'Engineer something big',  tags:['VR','Creativity','Projects'],       col:'#ff9a3c'},
  {name:'Friday',   icon:'trophy',  title:'Victory Royale Day', sub:'Debrief and celebrate',   tags:['Review','Rewards','Celebrate'],     col:'#f5c451'},
  {name:'Saturday', icon:'tree',    title:'Adventure Day',      sub:'Squad deployment',        tags:['Family','Outdoors','Fun'],          col:'#2fe0c0'},
  {name:'Sunday',   icon:'refresh', title:'Reset Day',          sub:'Prepare for the next mission', tags:['Prepare','Organise','Recharge'], col:'#ff3a5c'}
];
const MISSIONS = [
  {name:'Shield Recharge AM', icon:'sun',     what:'Brush teeth and have a wash'},
  {name:'Learning Quest',     icon:'book',    what:'Reading or school work'},
  {name:'Explorer Quest',     icon:'compass', what:'Get outside: walk, park or garden'},
  {name:'Level Up Challenge', icon:'bolt',    what:'Exercise or practise a new skill'},
  {name:'Team Quest',         icon:'users',   what:'Help with a job at home'},
  {name:'Shield Recharge PM', icon:'moon',    what:'Brush teeth and wash before bed'}
];
const RANKS = [
  {lvl:1, name:'Recruit',  icon:'chevrons'},
  {lvl:3, name:'Explorer', icon:'compass'},
  {lvl:5, name:'Champion', icon:'star'},
  {lvl:7, name:'Hero',     icon:'shield'},
  {lvl:9, name:'Legend',   icon:'crown'}
];
const REWARDS = [
  {id:'fortnite', icon:'pad',   name:'Fortnite Session',         cost:30},
  {id:'movie',    icon:'film',  name:'Movie Night',              cost:40},
  {id:'vr',       icon:'visor', name:'Dad & Douglas VR Session', cost:60},
  {id:'icecream', icon:'cone',  name:'Ice Cream Adventure',      cost:80}
];
const MAX_STARS = 42, TOKENS_PER_STAR = 2, FULL_DAY_BONUS = 3, STARS_PER_LEVEL = 5;

/* ================= State (local + cloud sync) ================= */
const KEY = 'douglasBattlePassV2';
const blankWeek = () => DAYS.map(() => MISSIONS.map(() => false));
const fresh = () => ({v:3, week:blankWeek(), weekNo:1, banked:0, spent:0, redeemed:[], badges:[]});
const valid = s => s && Array.isArray(s.week) && s.week.length === 7 && s.week.every(d => Array.isArray(d) && d.length === 6);
let state = loadLocal();

function loadLocal(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if (valid(s)) return Object.assign(fresh(), s); }catch(e){}
  return fresh();
}
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const CLIENT = Math.random().toString(36).slice(2, 10);
let ref = null, writing = false, dirty = false, pushTimer = null, lastRev = 0, readOnly = false, seenCloud = false;

function setSync(s){
  const el = $('sync'); el.dataset.s = s;
  el.querySelector('span').textContent = {local:'This device', connecting:'Linking', saving:'Saving', synced:'Synced', offline:'Offline', readonly:'View only'}[s] || s;
}
async function initCloud(){
  if (!window.claude || typeof window.claude.use !== 'function') return setSync('local');
  setSync('connecting');
  let db = null;
  try{ db = await window.claude.use('db'); }catch(e){}
  if (!db) return setSync('local');
  try{ ref = db.doc('game/state'); }catch(e){ return setSync('local'); }
  ref.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    if (!snap.exists){ if (!seenCloud){ seenCloud = true; dirty = true; flush(); } return; }
    seenCloud = true;
    const d = snap.data();
    if (d.by === CLIENT && d.rev === lastRev){ if (!dirty && !writing) setSync('synced'); return; }
    if (dirty || writing) return;
    if (valid(d.state)){ state = Object.assign(fresh(), JSON.parse(JSON.stringify(d.state))); saveLocal(); renderAll(); }
    setSync(readOnly ? 'readonly' : 'synced');
  }, () => setSync('offline'));
}
function persist(){
  saveLocal();
  if (!ref || readOnly) return;
  dirty = true; setSync('saving');
  clearTimeout(pushTimer); pushTimer = setTimeout(flush, 500);
}
async function flush(){
  if (!ref || writing || !dirty) return;
  writing = true; dirty = false; lastRev = Date.now();
  try{
    await ref.set({state:JSON.parse(JSON.stringify(state)), rev:lastRev, by:CLIENT, at:new Date().toISOString()});
    setSync('synced');
  }catch(e){
    if (e && (e.code === 'invalid_argument' || e.code === 'not_granted')){ readOnly = true; setSync('readonly'); }
    else { dirty = true; setSync('offline'); setTimeout(flush, 4000 + Math.random() * 2000); }
  }
  writing = false;
  if (dirty) flush();
}

/* ================= Game logic ================= */
const dayCount = i => state.week[i].filter(Boolean).length;
const stars    = () => state.week.flat().filter(Boolean).length;
const fullDays = () => DAYS.filter((_, i) => dayCount(i) === 6).length;
const earned   = () => stars() * TOKENS_PER_STAR + fullDays() * FULL_DAY_BONUS;
const tokens   = () => Math.max(0, state.banked + earned() - state.spent);
const level    = s => Math.min(9, 1 + Math.floor(s / STARS_PER_LEVEL));
const rankFor  = l => RANKS.filter(r => r.lvl <= l).pop();
const nextRank = l => RANKS.find(r => r.lvl > l);
const money    = s => s >= 30 ? 5 : s >= 25 ? 4 : s >= 20 ? 3 : 0;
const gaming   = c => c >= 6 ? 90 : c === 5 ? 75 : c === 4 ? 60 : 0;
const todayIdx = () => (new Date().getDay() + 6) % 7;
const missionDays = m => state.week.filter(d => d[m]).length;
function nextMoney(s){
  if (s < 20) return {need:20 - s, amt:3};
  if (s < 25) return {need:25 - s, amt:4};
  if (s < 30) return {need:30 - s, amt:5};
  return null;
}
const BADGES = [
  {id:'first',    icon:'rocket',  name:'First Mission',  hint:'Complete any mission',      test:() => stars() >= 1},
  {id:'explorer', icon:'compass', name:'Explorer',       hint:'Reach Level 3',             test:() => level(stars()) >= 3},
  {id:'brain',    icon:'brain',   name:'Brain Buff',     hint:'Learning Quest on 5 days',  test:() => missionDays(1) >= 5},
  {id:'team',     icon:'users',   name:'Team Player',    hint:'Team Quest on 5 days',      test:() => missionDays(4) >= 5},
  {id:'shield',   icon:'shield',  name:'Shield Master',  hint:'Teeth & wash, morning and night, on 5 days',    test:() => state.week.filter(d => d[0] && d[5]).length >= 5},
  {id:'perfect',  icon:'diamond', name:'Perfect Day',    hint:'All 6 missions in a day',   test:() => fullDays() >= 1},
  {id:'victory',  icon:'trophy',  name:'Victory Royale', hint:'Perfect Friday',            test:() => dayCount(4) === 6},
  {id:'legend',   icon:'crown',   name:'Legend',         hint:'Reach Level 9',             test:() => level(stars()) >= 9}
];
function checkBadges(){
  const got = [];
  BADGES.forEach(b => { if (!state.badges.includes(b.id) && b.test()){ state.badges.push(b.id); got.push(b); } });
  return got;
}

/* ================= Render ================= */
const $ = id => document.getElementById(id);
const ringStyle = (c, col) => `background:conic-gradient(${col} ${c / 6 * 360}deg, rgba(255,255,255,.08) 0)`;

function gamingHTML(c){
  const g = gaming(c);
  if (g) return `<div class="game open">${ic('pad')}<span>${g} Minutes Unlocked</span><small>after 4pm</small></div>`;
  const need = 4 - c;
  return `<div class="game lock">${ic('lock')}<span>Gaming Locked</span><small>${need} more mission${need > 1 ? 's' : ''}</small></div>`;
}

function renderNav(){
  $('nav').innerHTML = [['dash','home','Dashboard'],['story','target','Storyboard'],['rewards','gift','Rewards'],['guide','book','Guide']]
    .map(([k, i, l]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${ic(i)}${l}</button>`).join('');
}

function renderDash(){
  const t = todayIdx(), d = DAYS[t], c = dayCount(t), s = stars(), L = level(s);
  const r = rankFor(L), nr = nextRank(L), into = s - (L - 1) * STARS_PER_LEVEL;
  const xp = L >= 9 ? 100 : into / STARS_PER_LEVEL * 100, nm = nextMoney(s), g = gaming(c);
  $('v-dash').innerHTML = `
    <div class="brief glass" style="--dc:${d.col}">
      <div class="daymark">${ic(d.icon)}</div>
      <div class="eyebrow">Mission Briefing · ${d.name}</div>
      <h1>${d.title}</h1>
      <div class="sub">${t === 0 ? 'Our Wilde Space' : d.sub}</div>
      <div class="tags">${d.tags.map(x => `<span class="tag">${x}</span>`).join('')}</div>
      <div class="note">${ic('pad')}Complete missions to unlock gaming after 4pm</div>
      <div class="status">
        <span class="st ${g ? 'ok' : ''}">${g ? `${g} min unlocked today` : `${c}/6 complete · ${4 - c} to unlock`}</span>
        <button class="btn" data-go="story">Missions ${ic('arrow')}</button>
      </div>
    </div>

    <div class="rank glass">
      <div class="hex">${ic(r.icon)}</div>
      <div class="info">
        <div class="eyebrow">Level ${L} · Rank</div>
        <div class="name">${r.name}</div>
        <div class="bar"><i style="width:${xp}%"></i></div>
        <div class="meta">${L >= 9 ? 'Maximum level reached' : `${STARS_PER_LEVEL - into} stars to Level ${L + 1}${nr ? ` · ${nr.name} at Level ${nr.lvl}` : ''}`}</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat glass"><div class="k">${ic('star')}Battle Stars</div><div class="v">${s}<small> / ${MAX_STARS}</small></div><div class="h">This week</div></div>
      <div class="stat glass"><div class="k">${ic('token')}Screen Tokens</div><div class="v">${tokens()}</div><div class="h">+${earned()} this week</div></div>
      <div class="stat glass cash"><div class="k">${ic('pound')}Pocket Money</div><div class="v">£${money(s)}</div><div class="h">${nm ? `${nm.need} stars to £${nm.amt}` : 'Maximum reached'}</div></div>
      <div class="stat glass"><div class="k">${ic('chevrons')}Level</div><div class="v">${L}<small> / 9</small></div><div class="h">${r.name}</div></div>
    </div>

    <div class="week glass">
      <div class="row"><b>Weekly Progress</b><span>${Math.round(s / MAX_STARS * 100)}%</span></div>
      <div class="track"><div class="bar gold"><i style="width:${s / MAX_STARS * 100}%"></i></div>
        ${[20, 25, 30].map(m => `<div class="mk ${s >= m ? 'hit' : ''}" style="left:${m / MAX_STARS * 100}%"><em>£${money(m)}</em></div>`).join('')}
      </div>
      <div class="dots">${DAYS.map((x, i) => { const n = dayCount(i);
        return `<div class="dot ${n === 6 ? 'full' : ''} ${i === t ? 'today' : ''}"><b>${n}</b>${x.name.slice(0, 3)}</div>`; }).join('')}</div>
    </div>

    <h2 class="sec">Achievements</h2>
    <div class="badges">${BADGES.map(b => { const got = state.badges.includes(b.id);
      return `<div class="badge glass ${got ? '' : 'locked'}"><div class="medal">${ic(got ? b.icon : 'lock')}</div><div><b>${b.name}</b><small>${got ? 'Unlocked' : b.hint}</small></div></div>`; }).join('')}</div>`;
}

function renderStory(){
  const t = todayIdx();
  $('v-story').innerHTML = `<h2 class="sec">This Week's Missions</h2>` + DAYS.map((d, i) => {
    const c = dayCount(i);
    return `<div class="daycard glass ${i === t ? 'today' : ''}" id="day-${i}" style="--dc:${d.col}">
      <div class="dh">
        <div class="de">${ic(d.icon)}</div>
        <div class="t">
          <div class="dn">${d.name}${i === t ? '<span class="now">Today</span>' : ''}</div>
          <div class="dt">${d.title}</div>
          <div class="ds">${d.tags.join(' · ')}</div>
        </div>
        <div class="ring" style="${ringStyle(c, d.col)}"><span>${c}/6</span></div>
      </div>
      <div class="missions">${MISSIONS.map((m, j) => { const on = state.week[i][j];
        return `<button class="m ${on ? 'done' : ''}" data-d="${i}" data-m="${j}" aria-pressed="${on}">
          <span class="mi">${ic(m.icon)}</span><span class="mt">${m.name}<small>${m.what}</small></span><span class="ck">${ic('check')}</span></button>`; }).join('')}</div>
      ${gamingHTML(c)}
    </div>`;
  }).join('');
}

function renderRewards(){
  const tk = tokens(), hist = state.redeemed.slice().reverse();
  $('v-rewards').innerHTML = `
    <div class="bank glass">
      <div class="eyebrow" style="color:var(--gold)">Token Vault</div>
      <div class="v">${ic('token')}${tk}</div>
      <div class="h">2 tokens per mission · +3 for a perfect day</div>
    </div>
    <h2 class="sec">Reward Shop</h2>
    <div class="rgrid">${REWARDS.map(r => { const ok = tk >= r.cost;
      return `<div class="reward glass ${ok ? 'ready' : ''}">
        <div class="ri">${ic(r.icon)}</div>
        <div class="rn">${r.name}</div>
        <div class="rc">${ic('token')}${r.cost} tokens</div>
        <div class="bar gold"><i style="width:${Math.min(100, tk / r.cost * 100)}%"></i></div>
        <button class="btn ${ok ? 'gold' : 'ghost'}" data-redeem="${r.id}" ${ok ? '' : 'disabled'}>${ok ? 'Unlock' : `${r.cost - tk} to go`}</button>
      </div>`; }).join('')}</div>
    <h2 class="sec">Unlocked</h2>
    <div class="hist glass">${hist.length ? hist.map((h, k) => { const r = REWARDS.find(x => x.id === h.id);
      return `<div class="hrow"><span class="he">${ic(r ? r.icon : 'gift')}</span>
        <span class="hn">${h.name}<small>${h.date} · ${h.cost} tokens</small></span>
        <button data-undo="${state.redeemed.length - 1 - k}">Undo</button></div>`; }).join('')
      : `<div class="empty">No rewards unlocked yet</div>`}</div>`;
}

function renderGuide(){
  const card = (icon, title, body) => `<div class="gcard glass"><h3><span class="gi">${ic(icon)}</span>${title}</h3>${body}</div>`;
  const list = (items, no = []) => `<ul class="rules">${items.map((x, i) => `<li class="${no.includes(i) ? 'no' : ''}">${x}</li>`).join('')}</ul>`;
  $('v-guide').innerHTML = `
    <h2 class="sec">How We Play</h2>
    ${card('home', 'Monday - OWS', `<p>OWS is <b style="color:var(--ink)">Our Wilde Space</b>.</p><p>Monday is a dedicated day with Mum for learning, creativity, exploration, outdoor activities and fun.</p>`)}
    ${card('target', 'What Each Mission Means', `<div class="tbl">${MISSIONS.map(m =>
      `<div class="tr"><span>${m.name}</span><span style="color:var(--ink);text-align:right">${m.what}</span></div>`).join('')}</div>`)}
    ${card('pad', 'Gaming Rules', list(['No gaming in the morning.', 'Gaming is normally after 4pm.', 'Complete missions first.',

function renderTop(){

  $('weekLbl').textContent = `Week ${state.weekNo} · Level ${level(stars())}`;
}

/* ================= FX ================= */
let toastTimer;
function toast(items){
  const el = $('toast');
  el.innerHTML = items.map(([i, t, cls]) => `<div class="${cls || ''}">${ic(i)}<span>${t}</span></div>`).join('');
  el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
function shards(n = 40){
  const cols = ['#46e0ff', '#ffffff', '#f5c451', '#8a7dff', '#ff3a5c'];
  for (let i = 0; i < n; i++){
    const c = document.createElement('i'); c.className = 'shard';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
    c.style.boxShadow = `0 0 8px ${cols[i % cols.length]}`;
    c.style.setProperty('--x', (Math.random() * 120 - 60) + 'px');
    c.style.setProperty('--r', (Math.random() * 540 - 270) + 'deg');
    c.style.setProperty('--d', (1.4 + Math.random() * 1.4) + 's');
    c.style.animationDelay = Math.random() * .25 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 3400);
  }
}
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

function ask(title, body, okLabel = 'OK'){
  return new Promise(res => {
    $('mT').textContent = title; $('mB').textContent = body; $('mOk').textContent = okLabel;
    $('modal').hidden = false; $('mOk').focus();
    const done = v => { $('modal').hidden = true; $('mOk').onclick = $('mNo').onclick = null; res(v); };
    $('mOk').onclick = () => done(true); $('mNo').onclick = () => done(false);
  });
}

/* ================= Actions ================= */
let tab = 'dash';

function toggle(d, m){
  const bL = level(stars()), bG = gaming(dayCount(d)), bM = money(stars());
  state.week[d][m] = !state.week[d][m];
  const on = state.week[d][m];
  const aL = level(stars()), aG = gaming(dayCount(d)), aM = money(stars());
  const newB = checkBadges();
  persist(); renderAll(); space.pulse(on ? 1 : 0);
  if (!on) return;
  buzz(12);
  const msgs = [];
  if (dayCount(d) === 6) msgs.push(['diamond', `Perfect day · +${FULL_DAY_BONUS} tokens`, 'gold']);
  if (aL > bL){ const r = rankFor(aL); msgs.push(['up', r.lvl === aL ? `Level ${aL} · Rank: ${r.name}` : `Level ${aL} reached`]); }
  if (aG > bG) msgs.push(['pad', `${aG} minutes unlocked`, 'gold']);
  if (aM > bM) msgs.push(['pound', `Pocket money now £${aM}`, 'gold']);
  newB.forEach(b => msgs.push([b.icon, `Achievement: ${b.name}`, 'gold']));
  if (msgs.length){ toast(msgs); shards(dayCount(d) === 6 || aL > bL ? 60 : 30); buzz([20, 40, 20]); space.pulse(3); }
}

async function redeem(id){
  const r = REWARDS.find(x => x.id === id);
  if (!r || tokens() < r.cost) return;
  if (!await ask(`Unlock ${r.name}?`, `This costs ${r.cost} tokens.\nCheck with Mum or Dad first.`, 'Unlock')) return;
  state.spent += r.cost;
  state.redeemed.push({id:r.id, name:r.name, cost:r.cost,
    date:new Date().toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'})});
  persist(); renderAll(); toast([[r.icon, `${r.name} unlocked`, 'gold']]); shards(50); buzz([20, 40, 20]); space.pulse(3);
}

async function undo(idx){
  const h = state.redeemed[idx]; if (!h) return;
  if (!await ask(`Undo ${h.name}?`, `${h.cost} tokens will be returned.`, 'Undo')) return;
  state.spent = Math.max(0, state.spent - h.cost); state.redeemed.splice(idx, 1);
  persist(); renderAll();
}

async function newWeek(){
  const e = earned(), s = stars();
  if (!await ask(`Start Week ${state.weekNo + 1}?`, `${s} stars this week = £${money(s)} pocket money.\n${e} tokens will be kept.\nAll missions will reset.`, 'Start week')) return;
  state.banked += e; state.week = blankWeek(); state.weekNo += 1;
  persist(); go('dash');
  toast([['refresh', `Week ${state.weekNo} begins`]]); shards(40); space.pulse(4);
}

async function wipe(){
  if (!await ask('Reset everything?', 'Tokens, achievements, rewards and missions will be cleared on every device.', 'Reset')) return;
  if (!await ask('Are you sure?', 'This cannot be undone.', 'Yes, reset')) return;
  state = fresh(); persist(); go('dash');
}

function go(k){
  tab = k;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + k));
  renderAll(); space.setScene(k);
  if (k === 'story'){ const el = $('day-' + todayIdx()); setTimeout(() => el && el.scrollIntoView({behavior:'smooth', block:'start'}), 80); }
  else window.scrollTo({top:0, behavior:'smooth'});
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.closest('#modal')) return;
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.d !== undefined) return toggle(+t.dataset.d, +t.dataset.m);
  if (t.dataset.redeem) return redeem(t.dataset.redeem);
  if (t.dataset.undo !== undefined) return undo(+t.dataset.undo);
  if (t.dataset.act === 'newweek') return newWeek();
  if (t.dataset.act === 'wipe') return wipe();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) $('mNo').click(); });

/* ================= Cinematic 3D backdrop ================= */
const space = (() => {
  const noop = {setScene(){}, pulse(){}};

  const scene = new THREE.Scene();

  const dot = glowTex('rgba(255,255,255,1)', 'rgba(255,255,255,.35)');

  // Seeded value noise for procedural surfaces
  function noiseField(w, h, seed, oct){
    let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const layers = [];
    for (let o = 0; o < oct; o++){ const gw = 4 << o, gh = 2 << o, g = []; for (let i = 0; i < gw * (gh + 1); i++) g.push(rnd()); layers.push({gw, gh, g}); }
    const out = new Float32Array(w * h);

        const fx = x / w * L.gw, fy = y / h * L.gh, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
        const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);

  }

  // Deep starfield

  for (let i = 0; i < N; i++){
    const r = 120 + Math.random() * 520, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    sp.set([r * Math.sin(ph) * Math.cos(th), r * Math.sin(ph) * Math.sin(th), r * Math.cos(ph)], i * 3);
    const b = .45 + Math.random() * .55, tt = Math.random();
    sc.set(tt < .15 ? [b, b * .9, b * .7] : tt < .3 ? [b * .75, b * .9, b] : [b, b, b], i * 3);
  }
  const sg = new THREE.BufferGeometry();

  {

  }
  addEventListener('resize', resize); resize();
  addEventListener('pointermove', e => { px = e.clientX / innerWidth - .5; py = e.clientY / innerHeight - .5; }, {passive:true});

  const clock = new THREE.Clock(); let t = 0, running = true;
  function frame(){
    if (!running) return;
    const dt = Math.min(clock.getDelta(), .05); t += dt;
    boost *= .95;
    stars.rotation.y += dt * (.004 + boost * .05);
    const g = groups[current]; g.userData.tick && g.userData.tick(t, dt, boost);
    glare.material.opacity = .85 + Math.sin(t * .7) * .1;
    const ct = camTarget[current], sy = Math.min(scrollY, 2000) * .003;
    camera.position.x += (ct[0] + px * 3 - camera.position.x) * .04;
    camera.position.y += (ct[1] - py * 2 - sy - camera.position.y) * .04;
    camera.position.z += (ct[2] - boost * 4 - camera.position.z) * .06;
    camera.lookAt(0, -sy * 1.5, -30);
    renderer.render(scene, camera);
    if (!reduce) requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running && !reduce){ clock.getDelta(); requestAnimationFrame(frame); } });
  requestAnimationFrame(frame);

  return {
    setScene(k){ if (!groups[k] || k === current) return; groups[current].visible = false; current = k; groups[k].visible = true; glare.visible = glare2.visible = k !== 'story'; boost = Math.max(boost, 1.4); if (reduce){ running = true; frame(); } },
    pulse(n){ boost = Math.max(boost, n * .5); }
  };
})();

/* ================= Boot ================= */
checkBadges(); saveLocal(); renderAll(); initCloud();
</script>
